server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php index.html;

    # Cloudflare Flexible SSL → server hanya perlu handle HTTP
    # HTTPS ditangani oleh Cloudflare, jadi tidak perlu redirect ke HTTPS di sini

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        # Hindari 502 "upstream sent too big header" pada halaman Inertia dengan header lebih besar.
        fastcgi_buffer_size 64k;
        fastcgi_buffers 16 64k;
        fastcgi_busy_buffers_size 128k;
        fastcgi_temp_file_write_size 256k;

        # Informasikan ke Laravel bahwa request sebenarnya HTTPS (dari Cloudflare)
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
    }

    location ~ /\.(ht|env|git) {
        deny all;
    }

    client_max_body_size 50M;
    fastcgi_read_timeout 120s;
}
